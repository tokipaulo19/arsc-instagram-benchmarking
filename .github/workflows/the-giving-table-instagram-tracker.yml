name: The Giving Table Weekly Instagram Tracker

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "config/thegivingtable_competitors.csv"
      - "src/collect_instagram_apify.py"
      - "src/generate_weekly_report.py"
      - ".github/workflows/the-giving-table-instagram-tracker.yml"

  schedule:
    # Monday 10:00 AM Brisbane time, after the other trackers.
    - cron: "0 0 * * 1"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scheduled tracker
        if: github.event_name == 'schedule'
        run: |
          python src/collect_instagram_apify.py --mode continue --competitors-file config/thegivingtable_competitors.csv --snapshot-file data/thegivingtable/instagram_snapshots.csv --error-file data/thegivingtable/profile_validation_errors.csv --tracker-name "The Giving Table Competitor Tracker"

      - name: Run manual tracker
        if: github.event_name == 'workflow_dispatch'
        run: |
          python src/collect_instagram_apify.py --mode continue --replace-existing --competitors-file config/thegivingtable_competitors.csv --snapshot-file data/thegivingtable/instagram_snapshots.csv --error-file data/thegivingtable/profile_validation_errors.csv --tracker-name "The Giving Table Competitor Tracker"

      - name: Refresh tracker after configuration changes
        if: github.event_name == 'push'
        run: |
          python src/collect_instagram_apify.py --mode continue --replace-existing --competitors-file config/thegivingtable_competitors.csv --snapshot-file data/thegivingtable/instagram_snapshots.csv --error-file data/thegivingtable/profile_validation_errors.csv --tracker-name "The Giving Table Competitor Tracker"

      - name: Generate 30-day+ competitor report
        run: |
          python src/generate_weekly_report.py --snapshot-file data/thegivingtable/instagram_snapshots.csv --historical-file data/thegivingtable/historical.csv --report-file data/thegivingtable/weekly_report.csv --target-handle givingtablebylilianasanelli --target-label "The Giving Table"

      - name: Commit tracker data and report
        run: |
          git config user.name "The Giving Table Competitor Tracker"
          git config user.email "actions@github.com"

          git add data/thegivingtable/instagram_snapshots.csv
          git add data/thegivingtable/weekly_report.csv

          if [ -f data/thegivingtable/profile_validation_errors.csv ]; then
            git add data/thegivingtable/profile_validation_errors.csv
          fi

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "Weekly Giving Table competitor report $(date -u +'%Y-%m-%d')"
          git push
